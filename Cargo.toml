[package]
name = "mlb-api"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["postgres"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
uuid = "1.23.1"
